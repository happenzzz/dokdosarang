<!doctype html>
<html lang="ko">
<head>
<meta name="dokdo-build" content="20260912-cloudflare-realtime">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173d56">
<meta name="description" content="캐릭터로 둘러보고 학생 작품을 함께 전시하는 독도울림박물관">
<title>독도울림박물관</title>
<link rel="preload" as="image" href="assets/dokdo-museum-map.webp">
<link rel="preload" as="image" href="assets/avatar-atlas.png">
<link rel="stylesheet" href="/style.css">

</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <button class="brand-menu" id="helpBtn" aria-label="이용 방법">☰</button>
      <div class="brand-logo" aria-hidden="true">🌊</div>
      <div class="brand-copy">
        <strong id="museumTitle">독도울림박물관</strong>
        <span>독도를 만나고, 배우고, 우리의 생각을 전시해요</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="hud-btn" id="onlineBtn" aria-label="접속자 목록"><span class="online-dot"></span><span id="onlineCount">1</span></button>
      <button class="hud-btn purple" id="inviteBtn"><span>🔗</span><span class="label">초대하기</span></button>
      <button class="hud-btn" id="guideBtn"><span>🧭</span><span class="label">길찾기</span></button>
      <button class="hud-btn" id="browseBtn"><span>🖼️</span><span class="label">전체 전시</span></button>
      <button class="hud-btn primary" id="addBtn"><span>＋</span><span class="label">전시하기</span></button>
      <button class="hud-btn" id="profileBtn" aria-label="내 캐릭터 설정"><span class="profile-mini" id="profileMini" aria-hidden="true"></span></button>
      <button class="hud-btn teacher" id="teacherBtn"><span>⚙</span><span class="label">교사</span></button>
    </div>
  </header>

  <main class="museum-viewport" id="museumViewport">
    <div class="world-shell" id="worldShell">
      <div class="world" id="world" role="application" aria-label="독도울림박물관 이동 공간. 방향키나 WASD, 화면 터치로 이동할 수 있습니다.">
        <img class="map-image" id="mapImage" src="assets/dokdo-museum-map.webp" alt="다섯 전시관이 연결된 독도울림박물관 지도" draggable="false">

        <button class="zone-label" data-room="1"><span>🗺️ 독도 지리관</span><small><span data-room-count="1">0</span>개 전시</small></button>
        <button class="zone-label" data-room="2"><span>📜 독도 역사관</span><small><span data-room-count="2">0</span>개 전시</small></button>
        <button class="zone-label" data-room="3"><span>🐟 독도 생태관</span><small><span data-room-count="3">0</span>개 전시</small></button>
        <button class="zone-label" data-room="4"><span>💡 독도 교육관</span><small><span data-room-count="4">0</span>개 전시</small></button>
        <button class="zone-label" data-room="5"><span>💙 독도 사랑관</span><small><span data-room-count="5">0</span>개 전시</small></button>

        <button class="portal" data-room="1" aria-label="독도 지리관 입장"></button>
        <button class="portal" data-room="2" aria-label="독도 역사관 입장"></button>
        <button class="portal" data-room="3" aria-label="독도 생태관 입장"></button>
        <button class="portal" data-room="4" aria-label="독도 교육관 입장"></button>
        <button class="portal" data-room="5" aria-label="독도 사랑관 입장"></button>

        <div class="world-exhibits" id="worldExhibits" aria-label="공간에 전시된 작품"></div>
        <div id="remoteAvatars"></div>
        <div class="avatar" id="avatar" aria-label="내 캐릭터">
          <span class="name-tag me" id="avatarName">방문자</span>
          <span class="avatar-body" id="avatarBody"></span>
        </div>
      </div>
    </div>

    <button class="sync-badge" id="syncBadge">연결 확인 중</button>

    <aside class="floating-panel online-panel hidden" id="onlinePanel">
      <div class="panel-head"><strong>접속자</strong><button id="closeOnlineBtn" aria-label="접속자 목록 닫기">✕</button></div>
      <div class="online-list" id="onlineList"></div>
    </aside>

    <section class="floating-panel chat-panel" id="chatPanel" aria-label="전체 채팅">
      <div class="panel-head"><strong>💬 박물관 채팅</strong><button id="chatToggleBtn" aria-label="채팅 접기">−</button></div>
      <div class="chat-tabs"><span>전체</span></div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-form" id="chatForm">
        <label class="sr-only" for="chatInput">채팅 입력</label>
        <input id="chatInput" maxlength="120" autocomplete="off" placeholder="채팅을 입력해 주세요">
        <button type="submit" aria-label="채팅 보내기">↑</button>
      </form>
    </section>

    <div class="interaction hidden" id="interaction">
      <kbd>F</kbd>
      <div><strong id="interactionTitle">전시관 입장</strong><span>누르거나 이 버튼을 터치하세요</span></div>
    </div>

    <div class="reaction-menu hidden" id="reactionMenu" aria-label="반응 선택">
      <button data-reaction="👏" aria-label="박수">👏</button>
      <button data-reaction="❤️" aria-label="좋아요">❤️</button>
      <button data-reaction="👍" aria-label="멋져요">👍</button>
      <button data-reaction="🎉" aria-label="축하해요">🎉</button>
      <button data-reaction="🤔" aria-label="궁금해요">🤔</button>
    </div>

    <nav class="bottom-tools" aria-label="화면 도구">
      <button id="zoomOutBtn" aria-label="축소">−</button>
      <button id="zoomInBtn" aria-label="확대">＋</button>
      <button id="recenterBtn" aria-label="내 캐릭터로 이동">⌖</button>
      <span class="divider" aria-hidden="true"></span>
      <button id="reactionBtn" aria-label="반응">😊</button>
      <button id="fullscreenBtn" aria-label="전체 화면">⛶</button>
    </nav>

    <div class="stick" id="stick" aria-label="캐릭터 이동 조이스틱"><span class="stick-knob" id="stickKnob"></span></div>
  </main>
</div>

<div class="overlay hidden" id="overlay" aria-live="polite"></div>
<div class="toast" id="toast"></div>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-card">
    <div class="loading-logo">🌊</div>
    <strong>독도울림박물관</strong>
    <span>전시관 문을 열고 있어요</span>
  </div>
</div>

<!-- 접속자·캐릭터 위치·채팅은 Cloudflare Durable Objects WebSocket을 사용합니다.
     전시·학생·설정·첨부용 Firebase 코드는 다음 전환 단계까지 game.js에 보존합니다. -->
<script src="/game.js" defer></script>
</body>
</html>
